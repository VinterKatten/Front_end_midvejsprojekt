<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pokémon</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header><h1>POKÉMON</h1></header>

<nav>
    <a href="index.html">Home</a>
    <a href="poke.html">Pokémon</a>
    <a href="trainer.html">Trainer</a>
    <a href="dash.html">Dashboard</a>
</nav>

<main>
<h2>Pokémon</h2>

        <! For the filters -->
<div id="pokemonList">
    <h3>Pokémon list</h3>

    <label for="typeInput">Primary type: </label>
    <select id="typeInput" required>
        <option value="">All types</option>
    </select>

    <br><br>

    <label for="attackInput">Min. Atk: </label>
    <input type="number" id="attackInput" required placeholder="e.g. 80">

    <br><br>

    <label for="nameInput">Pokémon name: </label>
    <input type="text" id="nameInput" required placeholder="Search Pokémon">

    <button id="searchBtn">Search</button>

</div>

        <! The table -->
    <table id="pokemonTable">
        <tr>
            <th>ID</th>
            <th>Pokémon</th>
            <th>Name</th>
            <th>Primary type</th>
            <th>Secondary type</th>
            <th>HP</th>
            <th>speed</th>
            <th>Attack</th>
            <th>Defence</th>
            <th>Sp def</th>
            <th>Sp atk</th>
        </tr>
        <tbody id="pokemonData"></tbody>
    </table>


    <! Pagination for our table -->
    <div id="pagination">
        <button id="previousBtn">Prev</button>
        <span id="pageNumber">1</span>
        <button id="nextBtn">Next</button>
    </div>

</main>

<script src="poke.js"></script>
</body>
</html>
