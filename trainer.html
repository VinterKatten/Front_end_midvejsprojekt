<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Trainer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<header><h1>TRAINERS</h1></header>

<nav>
    <a href="index.html">Home</a>
    <a href="poke.html">Pokémon</a>
    <a href="trainer.html">Trainer</a>
    <a href="dash.html">Dashboard</a>
</nav>


<section>
    <h2>Trainer's Pokémon</h2>
    <label for="trainerSelect">Choose a trainer:</label>
    <select id="trainerSelect">
        <option value="">-- Select a trainer --</option>
    </select>
    <button id="viewPokemonBtn">See Pokémon</button>
    <div id="trainerPokemonResults"></div>

</section>

<section>
    <h2>Create a Trainer</h2>

    <form id="createTrainerform">
        <div class="field">
            <label for="trainerName">Trainer Name:</label>
            <input type="text" id="trainerName" maxlength="50" required>
        </div>
        <div class="field">
            <label for="trainerAge">Age:</label>
            <input type="number" id="trainerAge" min="0" max="150" step="1">
        </div>
        <div class="field">
            <label for="trainerHometown">Hometown:</label>
            <input type="text" id="trainerHometown" maxlength="50">
        </div>
        <button type="submit">Create Trainer</button>
    </form>
    <p id="trainerMessage" aria-live="polite"></p>
</section>

<section>
    <h2>Add Pokémon to Trainer</h2>
    <form id="createPokemonForm">
        <div class="field">
            <label for="PokemonName">Pokémon Name:</label>
            <input type="text" id="PokemonName" list="pokemonDatalist" maxlength="50" required autocomplete="off">
            <datalist id="pokemonDatalist"></datalist>
        </div>
        <div class="field">
            <label for="assignTrainerSelect">Trainer:</label>
            <select id="assignTrainerSelect" required>
                <option value="">-- Select trainer --</option>
            </select>
        </div>
        <button type="submit">Add Pokémon</button>
    </form>
    <p id="addPokemonMessage" aria-live="polite"></p>
</section>

<section>
    <h2>All Trainers</h2>
    <div id="trainerList"></div>
</section>

<script src="trainer.js"></script>
</body>
</html>
