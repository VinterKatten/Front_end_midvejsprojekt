<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Trainer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<header><h1>POKÉMON</h1></header>

<nav>
    <a href="index.html">Home</a>
    <a href="poke.html">Pokémon</a>
    <a href="trainer.html">Trainer</a>
    <a href="dash.html">Dashboard</a>
</nav>

<h2>TRAINER</h2>
<section>
    <h2>All Trainers</h2>
    <div id="trainerList"></div>
</section>

<section>
    <h2>Trainer´s pokemon</h2>
    <label for="trainerSelect">Choose a trainer:</label>
    <select id="trainerSelect">
        <option value="">-- Select a trainer --</option>
    </select>
    <button id="viewPokemonBtn">See Pokémon</button>
    <div id="trainerPokemonResults"></div>

</section>

<section>
    <h2>Create a Trainer</h2>

    <form id="createTrainerform">
                <label for="trainerName">Trainer Name:</label>
        <input type="text" id="trainerName" required>
        <label for="trainerAge">Age:</label>
        <input type="number" id="trainerAge">
        <label for="trainerHometown">Hometown:</label>
        <input type="text" id="trainerHometown">
        <button type="submit">Create Trainer</button>
    </form>
    <p id="trainerMessage"></p>
</section>

<section>
    <h2>Add Pokémon to Trainer</h2>
    <form id="createPokemonForm">
        <label for="assignTrainerName">Trainer Name:</label>
        <input type="text" id="assignTrainerName" required>

        <label for="PokemonName">Pokemon Name:</label>
        <input type="text" id="PokemonName" required>

        <button type="submit">Add Pokemon</button>
    </form>
    <p id="addPokemonMessage"></p>
</section>

<script src="trainer.js"></script>
</body>
</html>
