<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
    <script src="dash.js" defer></script>
</head>
<body>
    <main>
        <h1>Pokémon Dashboard</h1>
        <p>Explore Pokémon statistics</p>

        <section class="dashboard">
            <div class="chart-container">
                <h2>Average Attack by Type</h2>
                <canvas id="attackChart"></canvas>
            </div>

            <div class="chart-container">
                <h2>Pokémon Type Distribution</h2>
                <canvas id="typeChart"></canvas>
            </div>

            <div class="chart-container">
                <h2>Most Balanced Pokémon</h2>
                <canvas id="balancedChart"></canvas>
            </div>

        </section>
    </main>

</body>
</html>
